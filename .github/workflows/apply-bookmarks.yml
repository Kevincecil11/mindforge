name: Apply bookmarks feature

on:
  push:
    branches:
      - feature/bookmarks
    paths:
      - .github/workflows/apply-bookmarks.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load bookmark script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text()
          marker = '<script src="bookmark.js"></script>'
          if marker not in html:
              html = html.replace('</body>', marker + '\n</body>')
              path.write_text(html)
          PY
      - name: Commit feature
        run: |
          rm .github/workflows/apply-bookmarks.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/apply-bookmarks.yml
          git commit -m "Add quote bookmarks"
          git push
