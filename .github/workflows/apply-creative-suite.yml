name: Apply creative suite
on:
  push:
    branches: [feature/creative-suite]
    paths: [.github/workflows/apply-creative-suite.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect enhancements
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text()
          marker='<script src="enhancements.js"></script>'
          if marker not in html:
              html=html.replace('</body>',marker+'\n</body>')
              p.write_text(html)
          PY
      - name: Commit feature
        run: |
          rm .github/workflows/apply-creative-suite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html enhancements.js .github/workflows/apply-creative-suite.yml
          git commit -m "Add sharing progress and personal quotes"
          git push
