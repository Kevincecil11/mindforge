name: Apply laws expansion
on:
  push:
    branches: [feature/universal-laws-and-48]
    paths: [.github/workflows/apply-laws.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect laws script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text()
          marker='<script src="laws.js"></script>'
          if marker not in html:
              html=html.replace('</body>',marker+'\n</body>')
              p.write_text(html)
          PY
      - name: Commit
        run: |
          rm .github/workflows/apply-laws.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html laws.js .github/workflows/apply-laws.yml
          git commit -m "Add Universal Laws and complete the 48 Laws of Power"
          git push
