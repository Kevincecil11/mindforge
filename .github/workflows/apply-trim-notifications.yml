name: Apply trim and notifications
on:
  push:
    branches: [feature/trim-and-fix-notifications]
    paths: [.github/workflows/apply-trim-notifications.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Connect notifications script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          html=p.read_text()
          marker='<script src="notifications.js"></script>'
          if marker not in html:
              html=html.replace('</body>',marker+'\n</body>')
              p.write_text(html)
          PY
      - name: Commit
        run: |
          rm .github/workflows/apply-trim-notifications.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html notifications.js enhancements.js sw.js .github/workflows/apply-trim-notifications.yml
          git commit -m "Wire notifications and trim personal quotes"
          git push
